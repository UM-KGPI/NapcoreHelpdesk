# Retrieval questions for the opt-in sources (EU legislation, INSPIRE, and later DATEX II and TN-ITS).
# Not in the CI gate: the CI index has none of these sources. Run locally with semantic embeddings:
#   python manage.py run_retrieval_benchmark --input helpdesk/benchmarks/sources-questions.yaml --app-scope
# The "regression" questions were answered before a source was added; they show whether the new
# chunks crowd out the existing evidence.
version: '1.0'
description: Retrieval questions for opt-in sources, with expected sources.
created: '2026-11-05'
target_k:
- 4
- 6
- 10
questions:
# EU legislation already indexed (regression checks)
- id: src-leg01
  question: What is the role of the national access point as a metadata directory under MMTIS?
  intent: explanation
  tags: [legislation, regression]
  expected_source_patterns: ['02017R1926-20240304#art_3']
  min_hits: 1
  top_k_threshold: 10
- id: src-leg02
