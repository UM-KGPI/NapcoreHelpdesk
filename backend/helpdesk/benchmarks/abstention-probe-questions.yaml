version: "1.0"
description: >
  Questions for probe_abstention: off-topic, vague and bare-keyword questions that no benchmark
  question covers. The probe records the semantic abstention decision; `expect` is an optional
  judgement (abstain or answer) used only to flag disagreements, not to fail anything.
questions:
