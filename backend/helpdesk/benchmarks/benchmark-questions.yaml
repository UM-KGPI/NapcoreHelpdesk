version: "1.0"
description: >
  P4 evaluation benchmark for the NAPCORE Helpdesk graph-RAG vs baseline
  comparison. 140 retrieval questions (OpRa, NeTEx, SIRI) covering explanation,
  example, cross-standard mapping, disambiguation, and abstention intents. Used by the
  run_retrieval_benchmark management command to emit a hit@k / MRR report.
created: "2026-04-16"
target_k: [5, 10, 20]
