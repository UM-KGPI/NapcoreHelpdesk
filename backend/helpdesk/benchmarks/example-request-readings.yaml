# What each example request asks for, written by hand from the question's words (plan
# 2026-11-14-example-request-reading.md, R0). Measured with: python manage.py read_example_requests
#
# asked:      the element of the object the example is of; a list when more than one is right; "" when the
#             question names none. An abstract element (FareProduct) stands for its concrete objects.
# objects:    the other objects the example must have: kind (an element, or a list of acceptable ones) and count
#             (only when the question gives a number; null for "a quay", "quays"). The asked object is not listed.
# values:     the data the example must hold, as written, a clock time as HH:MM, a duration as xs:duration
#             (PT3M); an entry that is a list accepts any one of its spellings. Numbers that count objects are not
#             values. A currency code ("EUR") and a day ("Monday") are values.
# conditions: phrases that say when or how a service runs (reported, not in the gate).
# lang:       the question's language when not English. The app reads the asked object and parts from its English
#             rendering; the command gives the patterns the question as typed, so it reports these entries apart.
# unsure:     true where the right reading is open; note says why. Such entries are reported apart, not gated.
#
# gen01-gen45 are the questions of example-generation-questions.yaml; p01-p33 are requests from the prod question
# log as typed (spelling kept), not already among gen01-gen45.
