version: "1.0"
description: >
  Questions the helpdesk refused on prod (question log 2026-10-14 to 2026-11-14, still refused on 0.97.219), and
  questions it must keep refusing. `expect` is the judgement from checking the index for evidence (answer: the
  indexed sources answer it; abstain: they do not, or the question is not about the sources). `cause` is the
  mechanism that refused it on 0.97.219: keyword_rule (no standards concept matched, semantic_abstention),
  evidence_verdict (the answer model said the evidence does not answer it), policy_block (a cited source failed
  the allow-list). The must_refuse questions come from the log, from abstention-probe-questions.yaml and from the
  abstention questions of benchmark-questions.yaml. probe_abstention runs the keyword rules (and the relevance
  check when enabled) on them; the evidence_verdict ones need the answer model, so they are measured by asking
  the running backend (docs/plans/2026-11-14-refused-questions.md).
questions:
