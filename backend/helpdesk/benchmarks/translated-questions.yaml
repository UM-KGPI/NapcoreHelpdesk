# Non-English questions with known sources, for measuring the English search of non-English questions
# (retrieval_gateway.retrieve_chunks_with_trace). Not in the CI gate: CI has no LLM, so it would score them
# without the translation. Run locally with an LLM and semantic embeddings:
#   python manage.py run_retrieval_benchmark --input helpdesk/benchmarks/translated-questions.yaml --app-scope
# The standards questions are benchmark-questions.yaml entries translated by the Helpdesk's LLM on
# 2026-11-02 (id suffix -sl / -de); the legislation questions were written for issue #91.
