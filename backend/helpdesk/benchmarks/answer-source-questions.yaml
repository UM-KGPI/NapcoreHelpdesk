version: "1.0"
description: >
  Questions whose answer is in the index, with the source that answers them (plan
  docs/plans/2026-11-14-retrieval-misses.md, step Q0). Read by locate_answer_sources, which reports for each
  question where in the app's retrieval path that source is lost. The a-entries are the 23 questions of
  refused-questions.yaml that the sources answer (`ref` is their id there; `beside_point: true` marks the 3 that
  were answered from evidence about something else once #523 let them through). The b-entries are questions of
  the same kinds from the prod question log (2026-10-18 to 2026-11-14), chosen where the log shows the answer
  missing or beside the point, plus a few the app answers well, as controls.
  A pattern matches a passage when it is a case-insensitive substring of "<repository URL>/<source path>$": so
  "OpRa/README.md$" is OpRa's README and not NeTEx's, "#art_1$" is Article 1 and not Article 10. Every pattern
  was checked against the dev index (SourceChunk) on 2026-11-14; the Transmodel definitions
  (docs/ontology/standards/transmodel.ttl#...) come from GraphDB and were checked there. A question is found
  when any of its patterns matches. Several patterns are listed where more than one source answers.
  Patterns added in the step 0 review (2026-11-15, plan 2026-11-15-sources-prepared-for-semantic-search.md)
  were added only after reading the passage, each matches one indexed file (two for a03's parking examples).
  fitting_scope is the standardsScope a user who picked the standard would send (the chat page sends none);
  locate_answer_sources --fitting-scope measures with it.
  `unsure: true` marks entries where the wanted source is a judgement call; `note` gives the reason in one line.
  kind: everyday (the question's words are not the standard's), legislation, profile (mobilityDCAT-AP),
  overview (what a standard is or is for), element (a named schema element or concept).
