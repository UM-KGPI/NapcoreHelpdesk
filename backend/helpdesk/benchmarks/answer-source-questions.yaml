    note: "MMTIS Art. 4(1) and 5(1) list the standards and 'any digital machine-readable format' compatible with them; 2024/490 Art. 1 is the amended text. No act defines the term itself. Step 0 review (2026-11-15): 1 further source added after reading the passage, listed in the plan's record."
