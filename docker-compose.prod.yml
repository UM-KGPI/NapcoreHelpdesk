x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /app/backend
  env_file:
    - ./backend/.env.prod
  environment: &backend-env
    DJANGO_DEBUG: "False"
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    GRAPHDB_SPARQL_ENDPOINT: http://graphdb:7200/repositories/napcore-helpdesk
    GRAPHDB_REPOSITORY: napcore-helpdesk
    GRAPHDB_TIMEOUT_SECONDS: "30"
    # From scripts/build_env.sh. Empty or unset falls back to the VERSION file and "dev".
    SERVICE_VERSION: ${SERVICE_VERSION:-}
    SERVICE_BUILD_REF: ${SERVICE_BUILD_REF:-dev}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-napcore} -d ${POSTGRES_DB:-napcore_helpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-base
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"]
    volumes:
      - ./docs:/app/docs:ro
      - /opt/napcore-helpdesk/VERSION:/app/VERSION:ro
      - source-repos:/app/repos
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    cpus: ${BACKEND_CPUS:-2.0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      graphdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    <<: *backend-base
    # Without --concurrency Celery starts one process per host CPU: 40 on production, about 1.9 GB
    # of idle processes against the 2 GB limit (2026-11-07). The worker runs the nightly refresh,
    # harvests and clustering batches; two at a time is enough.
    command: celery -A config worker -l info --concurrency ${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - ./docs:/app/docs:ro
      - /opt/napcore-helpdesk/VERSION:/app/VERSION:ro
      - source-repos:/app/repos
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-2g}
    cpus: ${CELERY_WORKER_CPUS:-1.5}

  # Semantic embeddings: one process holds the model (about 0.9 GB) for the backend and the
  # worker. Started only with the "semantic" profile (COMPOSE_PROFILES=semantic in the compose
  # .env file), together with EMBEDDING_BACKEND=semantic; see docs/production-deployment.md.
  embedder:
    <<: *backend-base
    profiles: ["semantic"]
    command: python -m helpdesk.embedding_service
    volumes:
      - embedding-models:/models
    mem_limit: ${EMBEDDER_MEM_LIMIT:-1536m}
    cpus: ${EMBEDDER_CPUS:-2.0}
    environment:
      <<: *backend-env
      # One model thread per CPU the container may use. More threads than CPUs are throttled: 80 threads
      # (one per host core) under a 2-CPU limit made every embedding slow on prod (2026-11-09).
      # EMBEDDER_THREADS overrides it; the embedder logs the thread count it uses at startup.
      EMBEDDER_THREADS: ${EMBEDDER_THREADS:-${EMBEDDER_CPUS:-2}}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  # Validates the NeTEx example generator's fragments against NeTEx_publication.xsd from the indexed NeTEx
  # checkout: one compiled schema (about 170 MB, 20 s to compile) for every backend worker, and the
  # model-written XML parsed outside the backend. Recompiles after a source refresh moves the checkout.
  netex-validator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/backend
    command: python -m helpdesk.netex_validator_service
    volumes:
      - source-repos:/app/repos:ro
    mem_limit: ${NETEX_VALIDATOR_MEM_LIMIT:-512m}
    cpus: ${NETEX_VALIDATOR_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  celery-beat:
    <<: *backend-base
    command: celery -A config beat -l info
    volumes:
      - ./docs:/app/docs:ro
      - /opt/napcore-helpdesk/VERSION:/app/VERSION:ro
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-512m}
    cpus: ${CELERY_BEAT_CPUS:-0.5}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.6.1}
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # nginx shows the maintenance page while maintenance/on exists (scripts/deploy.sh
      # creates it for the duration of a deploy). The directory is tracked in git so it
      # exists, owned by the deploy user, before the first `up`.
      - ./maintenance:/etc/nginx/maintenance:ro
      # Transmodel EA HTML export (issue #151), cloned and updated by scripts/deploy.sh.
      - ./transmodel-html:/usr/share/nginx/transmodel:ro
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}

  graphdb:
    image: ${GRAPHDB_IMAGE:-ontotext/graphdb:11.3.3}
    restart: unless-stopped
    environment:
      GDB_JAVA_OPTS: >-
        -Xms${GRAPHDB_HEAP_MIN:-2g}
        -Xmx${GRAPHDB_HEAP_MAX:-4g}
    volumes:
      - graphdb-data:/opt/graphdb/home
      - /opt/napcore-helpdesk/secrets/graphdb.license:/opt/graphdb/home/conf/graphdb.license:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7200/rest/repositories"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: ${GRAPHDB_MEM_LIMIT:-6g}
    cpus: ${GRAPHDB_CPUS:-2.0}

volumes:
  postgres-data:
  graphdb-data:
  source-repos:
  embedding-models:
