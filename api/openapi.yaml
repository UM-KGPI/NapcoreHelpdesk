      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
          additionalProperties: false
      additionalProperties: false
    IndexRepositoryRequest:
      type: object
      required: [repoUrl, repoPath]
      properties:
        repoUrl:
          type: string
          format: uri
          description: Approved repository URL (must be in ALLOWED_SOURCE_REPOSITORIES)
        repoPath:
          type: string
          description: Absolute local filesystem path to an already-cloned repository
        profile:
          type: string
          default: default
          description: Index profile name (corresponds to index_profiles/<profile>.yaml)
        incremental:
          type: boolean
          default: true
          description: Skip files whose per-file content hash is unchanged
        prune:
          type: boolean
          default: false
          description: Delete chunks for files no longer present in the repository
        includeIssues:
          type: boolean
          default: false
          description: Fetch and index GitHub issues/comments in addition to repository files
        autoAllowRepository:
          type: boolean
          default: true
          description: Add unknown repository URL to in-process allow-list before indexing
      additionalProperties: false
    HarvestSourceRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: Configured source name (see GET /api/v1/admin/sources)
        full:
          type: boolean
          default: false
          description: Re-index all files and reload the ontology even if unchanged
      additionalProperties: false
    HarvestSourceAccepted:
      type: object
      required: [requestId, jobId, source, state]
      properties:
        requestId:
          type: string
        jobId:
          type: string
        source:
          type: string
        state:
          type: string
          enum: [queued]
    HarvestJobResponse:
      type: object
      required: [requestId, jobId, state, result, error]
      properties:
        requestId:
          type: string
        jobId:
          type: string
        state:
          type: string
          enum: [queued, running, finished, error]
        result:
          type: [object, "null"]
          description: Refresh report, status ok|partial|failed|skipped with one result row per source
          additionalProperties: true
        error:
          type: [string, "null"]
    HarvestSource:
      type: object
      required: [name, repositoryUrl, profile, checkoutPresent, indexedChunks, indexedCommit, indexedAt, ontology]
      properties:
        name:
          type: string
        repositoryUrl:
          type: string
          format: uri
        profile:
          type: string
        checkoutPresent:
          type: boolean
        indexedChunks:
          type: integer
          minimum: 0
        indexedCommit:
          type: [string, "null"]
        indexedAt:
          type: [string, "null"]
          format: date-time
        ontology:
          type: [object, "null"]
          properties:
            key:
              type: string
            graphUri:
              type: string
              format: uri
            version:
              type: [string, "null"]
            lastLoadedAt:
              type: [string, "null"]
              format: date-time
    SourcesResponse:
      type: object
      required: [requestId, sources]
      properties:
        requestId:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/HarvestSource'
