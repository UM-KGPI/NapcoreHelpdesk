    IndexRepositoryResponse:
      type: object
      required: [status, requestId, repositoryUrl, repositoryPath, profile, incremental, prune, autoAllowedRepository, scannedFiles, skippedFiles, createdChunks, updatedChunks, deletedChunks]
      properties:
        status:
          type: string
          enum: [ok]
        requestId:
          type: string
        repositoryUrl:
          type: string
          format: uri
        repositoryPath:
          type: string
        profile:
          type: string
        incremental:
          type: boolean
        prune:
          type: boolean
        autoAllowedRepository:
          type: boolean
        scannedFiles:
          type: integer
          minimum: 0
        skippedFiles:
          type: integer
          minimum: 0
        createdChunks:
          type: integer
          minimum: 0
        updatedChunks:
          type: integer
          minimum: 0
        deletedChunks:
          type: integer
          minimum: 0
      additionalProperties: false
