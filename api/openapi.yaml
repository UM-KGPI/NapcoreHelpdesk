        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    EditorUserResponse:
      type: object
      required: [requestId, user]
      properties:
        requestId:
          type: string
        user:
          $ref: '#/components/schemas/EditorUser'
