name: Ontology Drift Check

# The OpRa, SIRI and NeTEx ontologies are generated from the upstream repositories, never edited by hand
# (docs/ontology/GENERATION.md). Weekly, regenerate them from each repository's default branch and open
# a pull request when the generated files differ from the committed ones.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ontology-drift
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate ontologies
    runs-on: ubuntu-latest

    env:
      # Generation reads XSD files only; nothing connects to a database or GraphDB.
      DJANGO_SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-bytes
      GRAPHDB_ENABLED: "False"
      NAPCORE_SKIP_GRAPHDB_IMPORT: "1"
      LLM_ENABLED: "False"
      CONTROLLER_LLM_ENABLED: "False"
      GRAPH_RAG_ENABLED: "False"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # build_transmodel_alignment needs rdflib, which the application itself does not.
          pip install "rdflib==7.6.0"

      - name: Clone the standards repositories (default branch)
        id: upstream
        run: |
          set -euo pipefail
          for name in NeTEx SIRI OpRa; do
            git clone -q --depth 1 "https://github.com/TransmodelEcosystem/$name" "$RUNNER_TEMP/upstream/$name"
            sha="$(git -C "$RUNNER_TEMP/upstream/$name" rev-parse HEAD)"
            files="$(git -C "$RUNNER_TEMP/upstream/$name" ls-files | wc -l | tr -d ' ')"
            echo "$name @ $sha ($files files)"
            echo "$(echo "$name" | tr 'A-Z' 'a-z')_sha=$sha" >> "$GITHUB_OUTPUT"
            # A failed or partial clone must not be mistaken for an upstream that deleted its schemas.
            if [[ "$files" -lt 20 ]]; then
              echo "$name checkout has only $files files; refusing to regenerate" >&2
              exit 1
            fi
          done

      - name: Regenerate the standard ontologies
        working-directory: backend
        run: |
          set -euo pipefail
          python manage.py build_standard_ontologies \
            --netex-path "$RUNNER_TEMP/upstream/NeTEx" \
            --opra-path "$RUNNER_TEMP/upstream/OpRa" \
            --siri-path "$RUNNER_TEMP/upstream/SIRI"

      - name: Compare with the committed files
        id: diff
        run: |
          set -euo pipefail
          files=(docs/ontology/standards/opra.ttl docs/ontology/standards/siri.ttl docs/ontology/standards/netex.ttl)
          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated ontologies match the committed files."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            for f in "${files[@]}"; do
              if ! git diff --quiet -- "$f"; then
                before=$(git show "HEAD:$f" | grep -c ' a owl:Class' || true)
                after=$(grep -c ' a owl:Class' "$f" || true)
                echo "- \`$(basename "$f")\`: $before to $after classes, $(git diff --numstat -- "$f" | awk '{print "+"$1" / -"$2}') lines"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the Transmodel alignments
        if: steps.diff.outputs.changed == 'true'
        working-directory: backend
        run: python manage.py build_transmodel_alignment

      - name: Drop alignment files that changed only in their date lines
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in docs/ontology/alignments/transmodel-*-align.ttl docs/ontology/alignments/transmodel-alignment-report.md; do
            git diff --quiet -- "$f" && continue
            real=$(git diff -U0 -- "$f" | grep '^[+-]' | grep -v '^+++\|^---' | grep -vc 'GENERATED by\|Generated by\|dct:created\|dct:modified' || true)
            if [[ "$real" -eq 0 ]]; then
              git checkout -- "$f"
              echo "restored $f (date lines only)"
            fi
          done

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ontology): regenerate the standard ontologies from upstream"
          title: "chore(ontology): regenerate the standard ontologies from upstream"
          body: |
            ## Ontology drift

            The OpRa, SIRI and NeTEx ontologies are generated from the upstream repositories
            (`build_standard_ontologies`, see `docs/ontology/GENERATION.md`). Regenerated from each
            repository's default branch, they differ from the committed files:

            ${{ steps.diff.outputs.summary }}

            | Repository | Commit |
            |---|---|
            | NeTEx | `${{ steps.upstream.outputs.netex_sha }}` |
            | SIRI | `${{ steps.upstream.outputs.siri_sha }}` |
            | OpRa | `${{ steps.upstream.outputs.opra_sha }}` |

            `transmodel-*-align.ttl` and the alignment report are regenerated from the new files.

            **Not done by this workflow:** loading the graphs into GraphDB and running the retrieval
            benchmark. Run `load_graphdb_ontologies --apply --replace` and
            `run_retrieval_benchmark --app-scope` against the changed files before merging, as was done
            for #61. After merging and deploying, load the graphs on the server and restart the backend
            and the worker (`docs/production-deployment.md`, section 12.2). If old and new files have the
            same triples (`rdflib.compare.isomorphic`), the change is only reordering and needs no load.
            The pull request has no CI checks because it is opened with the workflow token.
          base: main
          branch: chore/regenerate-standard-ontologies
          delete-branch: true
          add-paths: |
            docs/ontology/standards/opra.ttl
            docs/ontology/standards/siri.ttl
            docs/ontology/standards/netex.ttl
            docs/ontology/alignments/transmodel-*-align.ttl
            docs/ontology/alignments/transmodel-alignment-report.md

      - name: Workflow summary
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          {
            echo "## Ontology drift check"
            echo "- NeTEx @ ${{ steps.upstream.outputs.netex_sha }}"
            echo "- SIRI @ ${{ steps.upstream.outputs.siri_sha }}"
            echo "- OpRa @ ${{ steps.upstream.outputs.opra_sha }}"
            if [[ "$CHANGED" == "true" ]]; then
              echo "- Generated files differ from the committed ones: pull request opened or updated."
            else
              echo "- Generated files match the committed ones."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
