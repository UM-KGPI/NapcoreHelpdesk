name: Version Bump On Merge

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

# One bump at a time, in merge order: each reads VERSION from main and writes the next one.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore(version): bump to')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine bump level
        id: bump_level
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map((l) => l.name);
            let bump = "patch";
            if (labels.includes("version:major")) {
              bump = "major";
            } else if (labels.includes("version:minor")) {
              bump = "minor";
            } else if (labels.includes("version:patch")) {
              bump = "patch";
            }

            core.setOutput("bump", bump);
            core.setOutput("labels", labels.join(", ") || "none");

      - name: Bump VERSION
        id: bump_version
        env:
          BUMP: ${{ steps.bump_level.outputs.bump }}
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "VERSION file is missing" >&2
            exit 1
          fi

          raw="$(tr -d '[:space:]' < VERSION)"
          base="${raw%%+*}"
          base="${base%%-*}"

          IFS='.' read -r major minor patch <<< "$base"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Unsupported VERSION format: $raw" >&2
            exit 1
          fi

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump level: $BUMP" >&2
              exit 1
              ;;
          esac

          new_version="$major.$minor.$patch"
          echo "$new_version" > VERSION
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit VERSION to main
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          BUMP: ${{ steps.bump_level.outputs.bump }}
          LABELS: ${{ steps.bump_level.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(version): bump to ${NEW_VERSION} (${BUMP})" -m "Triggered by merged PR #${PR_NUMBER}; labels: ${LABELS}."
          # main may have moved since checkout (another merge); VERSION is only written here, one run at a time.
          pushed=""
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed="yes"
              break
            fi
            git pull --rebase origin main
          done
          if [[ -z "$pushed" ]]; then
            echo "Could not push the VERSION bump to main after 3 attempts" >&2
            exit 1
          fi
          {
            echo "## Version Bump"
            echo "- PR labels: $LABELS"
            echo "- Applied bump: $BUMP"
            echo "- New VERSION: $NEW_VERSION (committed to main)"
          } >> "$GITHUB_STEP_SUMMARY"
