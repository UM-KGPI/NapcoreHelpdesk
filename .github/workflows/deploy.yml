name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true

permissions:
  contents: read

jobs:
  guard:
    name: Confirm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi

  ci:
    name: CI must pass
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    # Runs on the production server itself, on a self-hosted runner registered with the
    # label below (docs/production-deployment.md, section 5). GitHub-hosted runners cannot
    # reach the server (issue #39), and no SSH key is needed this way. Do not use this label
    # in any workflow that pull requests can start: that code would run on the production host.
    runs-on: [self-hosted, napcore-prod]
    timeout-minutes: 45
    # One deployment at a time; a second run waits for the first instead of overlapping it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy on the server
        run: bash -eux /opt/napcore-helpdesk/scripts/deploy.sh
