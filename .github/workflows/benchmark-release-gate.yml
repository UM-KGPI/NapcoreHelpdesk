name: Benchmark Release Gate

# Manual pre-release check: same index and questions as the PR benchmark, with a
# stricter default tolerance. Not covered: GraphDB-backed retrieval and provider
# embeddings (see benchmark-regression.yml).

on:
  workflow_dispatch:
    inputs:
      baseline_file:
        description: 'Reference JSON with an aggregate section (repo-relative path)'
        required: false
        default: 'backend/helpdesk/benchmarks/ci-baseline.json'
      max_drop:
        description: 'Allowed absolute drop in hit@10 and MRR@10 per mode'
        required: false
        default: '0.01'

permissions:
  contents: read

jobs:
  release-benchmark:
    name: Retrieval Benchmark (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-bytes
      NAPCORE_SKIP_GRAPHDB_IMPORT: "1"
      GRAPHDB_ENABLED: "False"
      GRAPH_RAG_ENABLED: "False"
      LLM_ENABLED: "False"
      CONTROLLER_LLM_ENABLED: "False"
      POSTGRES_DB: napcore_helpdesk
      POSTGRES_USER: napcore
      POSTGRES_PASSWORD: napcore
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: napcore_helpdesk
          POSTGRES_USER: napcore
          POSTGRES_PASSWORD: napcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U napcore -d napcore_helpdesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build benchmark index
        uses: ./.github/actions/benchmark-index

      - name: Run retrieval benchmark
        working-directory: backend
        env:
          BASELINE_FILE: ${{ github.event.inputs.baseline_file }}
          MAX_DROP: ${{ github.event.inputs.max_drop }}
        run: |
          python manage.py run_retrieval_benchmark \
            --quiet \
            --output "$GITHUB_WORKSPACE/benchmark-report.json" \
            --gate-against "$GITHUB_WORKSPACE/${BASELINE_FILE}" \
            --max-drop "${MAX_DROP}" | tee "$GITHUB_WORKSPACE/release-summary.txt"

      - name: Upload benchmark report and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark
          path: |
            benchmark-report.json
            release-summary.txt
          if-no-files-found: ignore

      - name: Publish summary
        if: always() && hashFiles('release-summary.txt') != ''
        run: |
          {
            echo '## Release gate benchmark'
            echo '```'
            cat release-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
