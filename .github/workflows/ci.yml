name: CI

# Not on push to main: main only receives squash merges of pull requests that passed this workflow, and the
# deploy runs it again (workflow_call) before deploying.
on:
  pull_request:
  workflow_call:

# A new push to a pull request cancels its older run. Other runs (the deploy's call) get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      # Without this, a broken nginx config only shows when the frontend fails to start after a deploy.
      - name: Check nginx config
        run: docker run --rm -v "$PWD/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for secrets
        run: bash scripts/scan_secrets.sh

  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-bytes
      NAPCORE_SKIP_GRAPHDB_IMPORT: "1"
      GRAPHDB_ENABLED: "False"
      GRAPH_RAG_ENABLED: "False"
      POSTGRES_DB: napcore_helpdesk
      POSTGRES_USER: napcore
      POSTGRES_PASSWORD: napcore
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: napcore_helpdesk
          POSTGRES_USER: napcore
          POSTGRES_PASSWORD: napcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U napcore -d napcore_helpdesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Django check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test -v 1

  openapi-contract:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Validate OpenAPI
        run: bash scripts/validate-openapi.sh api/openapi.yaml
