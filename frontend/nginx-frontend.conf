server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Maintenance mode. scripts/deploy.sh creates this file for the duration of a deploy; it is
    # a bind mount of <repo>/maintenance (docker-compose.prod.yml). Create or delete it by hand
    # for planned maintenance. Checked per request, so no reload is needed.
    set $maintenance_flag /etc/nginx/maintenance/on;

    # Serve static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Transmodel model: the Enterprise Architect HTML export (issue #151), a checkout of the
    # UM-KGPI/transmodel-html repository mounted read-only (docker-compose.prod.yml). ^~ keeps the
    # static-asset rule above from taking its images, and a re-export reuses file names
    # (EA3861.png), so they get a short cache instead of an immutable one. Answers link class
    # pages as /transmodel/index.htm?guid=<EA GUID>.
    location ^~ /transmodel/ {
        root /usr/share/nginx;
        index index.htm;
        expires 1h;
    }

    # API requests - dynamic upstream so DNS re-resolves after backend restarts
    location /api/ {
        if (-f $maintenance_flag) {
            return 503;
        }
        # 502/504 here are nginx's own, for a backend that is restarting or unreachable.
        # Responses from Django itself (including its own 503 from /health/ready) pass
        # through unchanged because proxy_intercept_errors stays off.
        error_page 502 503 504 =503 @maintenance_api;

        set $backend http://backend:8000;
        proxy_pass $backend;
        # Preserve original Host header for Django's ALLOWED_HOSTS check
        # (allows backend to validate that requests come from expected domain)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        if (-f $maintenance_flag) {
            return 503;
        }
        error_page 503 @maintenance_page;
        try_files $uri $uri/ /index.html;
    }

    # Same error envelope as the API's own errors, so the SPA shows the message.
    location @maintenance_api {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The helpdesk is being updated. Please try again in a minute."}}';
    }

    location @maintenance_page {
        root /usr/share/nginx/maintenance;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        try_files /maintenance.html =503;
    }
}
