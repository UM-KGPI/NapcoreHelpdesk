<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <meta name="robots" content="noindex">
  <title>NAPCORE Helpdesk: updating</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6475; --card: #ffffff; --line: #dfe3ea; --title: #003399; --rule: #ffcc00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171d; --fg: #e8ebf1; --muted: #a3abba; --card: #1d2129; --line: #2f3542; --title: #9db5ff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 32rem; margin: 1rem; padding: 2rem; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--rule); border-radius: 12px; }
    h1 { margin: 0 0 0.75rem; font-size: 1.35rem; color: var(--title); }
    p { margin: 0 0 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>The helpdesk is being updated</h1>
    <p>A new version is being installed. This usually takes about a minute.</p>
    <p class="muted">This page reloads by itself every 30 seconds.</p>
  </main>
</body>
</html>
