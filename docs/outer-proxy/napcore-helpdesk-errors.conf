# NAPCORE Helpdesk: error page for when the Helpdesk behind this proxy cannot be reached.
#
# Goes into the existing server { } block for kgpi.fgpa.um.si. Two changes:
#   1. one error_page line inside the existing location for /napcore-helpdesk/ (do not change its
#      proxy_pass or anything else there);
#   2. the named location below, next to it.
# The files live on this proxy host, so they are served even when the Helpdesk host is down.
#
# Only the errors this proxy produces itself are replaced: 502 (cannot connect) and 504 (timed out).
# Responses from the Helpdesk itself, including its own 503 maintenance page during deploys, pass
# through unchanged, because proxy_intercept_errors stays off. The status code stays 502/504
# (error_page without "="), so browsers, caches and the Helpdesk's own status banner still see a failure.

# 1. Inside the existing location:
#
#    location /napcore-helpdesk/ {
#        ...existing proxy_pass and headers...
#        error_page 502 504 @napcore_helpdesk_unavailable;
#    }

# 2. Next to it:
location @napcore_helpdesk_unavailable {
    root /var/www/napcore-helpdesk-errors;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 60 always;
    # API calls get JSON the web app can show; everything else gets the HTML page.
    if ($uri ~ ^/napcore-helpdesk/api/) {
        rewrite ^ /unavailable.json break;
    }
    rewrite ^ /unavailable.html break;
}
